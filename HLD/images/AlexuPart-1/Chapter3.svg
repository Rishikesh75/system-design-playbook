<svg version="1.1" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 962.112130514726 625.5923719384971" width="962.112130514726" height="625.5923719384971"><!-- svg-source:excalidraw --><metadata></metadata><defs><style class="style-fonts">
      @font-face { font-family: Excalifont; src: url(data:font/woff2;base64,); }</style></defs><rect x="0" y="0" width="962.112130514726" height="625.5923719384971" fill="#ffffff"></rect><g transform="translate(33.399993896484375 20) rotate(0 243.8998565673828 12.5)"><text x="0" y="17.619999999999997" font-family="Excalifont, Xiaolai, Segoe UI Emoji" font-size="20px" fill="#1e1e1e" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">FrameWork to Handle System Design Interview</text></g><g transform="translate(20 104.39999389648438) rotate(0 224.33984375 12.5)"><text x="0" y="17.619999999999997" font-family="Excalifont, Xiaolai, Segoe UI Emoji" font-size="20px" fill="#e03131" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">1.Understand Problem Statement - (5 - 10Min)</text></g><g transform="translate(28.89107453703707 349.83689063202996) rotate(0 202.15988159179688 12.5)"><text x="0" y="17.619999999999997" font-family="Excalifont, Xiaolai, Segoe UI Emoji" font-size="20px" fill="#e03131" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">2.Propose High Level design (15 - 20 Min)</text></g><g transform="translate(25.2000732421875 453.5089373026557) rotate(0 156.15988159179688 12.5)"><text x="0" y="17.619999999999997" font-family="Excalifont, Xiaolai, Segoe UI Emoji" font-size="20px" fill="#e03131" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">3.Design Deep Dive (20-25 Min)</text></g><g transform="translate(33.04022216796875 547.2999877929688) rotate(0 103.98991394042969 12.5)"><text x="0" y="17.619999999999997" font-family="Excalifont, Xiaolai, Segoe UI Emoji" font-size="20px" fill="#e03131" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">4.WrampUps (3-5 Min)</text></g><g transform="translate(97.17164240735593 137.20962412981754) rotate(0 243.43978881835935 10)"><text x="0" y="14.096" font-family="Excalifont, Xiaolai, Segoe UI Emoji" font-size="16px" fill="#1e1e1e" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">Don't Jump right directly into solutions take time think deeply</text></g><g transform="translate(100.38556940865129 164.63482940225128) rotate(0 210.48780822753903 10)"><text x="0" y="14.096" font-family="Excalifont, Xiaolai, Segoe UI Emoji" font-size="16px" fill="#1e1e1e" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">Ask Right questions and Write Down the Assumptions</text></g><g transform="translate(157.16436884771957 195.27396167598033) rotate(0 202.6557922363281 10)"><text x="0" y="14.096" font-family="Excalifont, Xiaolai, Segoe UI Emoji" font-size="16px" fill="#1e1e1e" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">what kind of specific features we are going to build</text></g><g transform="translate(158.0214269458728 216.48565103056478) rotate(0 187.8638458251953 10)"><text x="0" y="14.096" font-family="Excalifont, Xiaolai, Segoe UI Emoji" font-size="16px" fill="#1e1e1e" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">How many users does the product going to have</text></g><g transform="translate(157.59288155008443 237.48310038067854) rotate(0 206.46382141113284 10)"><text x="0" y="14.096" font-family="Excalifont, Xiaolai, Segoe UI Emoji" font-size="16px" fill="#1e1e1e" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">is this a mobile app or webApplication or DesktopApp</text></g><g transform="translate(157.80715424797864 267.0509345517837) rotate(0 147.8638763427734 10)"><text x="0" y="14.096" font-family="Excalifont, Xiaolai, Segoe UI Emoji" font-size="16px" fill="#1e1e1e" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">How many frnds user can atmost have</text></g><g transform="translate(160.16399045769714 289.97670740925105) rotate(0 216.90382385253903 10)"><text x="0" y="14.096" font-family="Excalifont, Xiaolai, Segoe UI Emoji" font-size="16px" fill="#1e1e1e" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">is the new feed should be in reverse chronological order</text></g><g transform="translate(114.95523014302142 392.6070852566778) rotate(0 230.92779541015628 10)"><text x="0" y="14.096" font-family="Excalifont, Xiaolai, Segoe UI Emoji" font-size="16px" fill="#1e1e1e" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">prepare the Bule print for the design ask for the feedback</text></g><g transform="translate(96.56086098347595 585.5923719384971) rotate(0 422.775634765625 10)"><text x="0" y="14.096" font-family="Excalifont, Xiaolai, Segoe UI Emoji" font-size="16px" fill="#1e1e1e" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">Never say you design is perfect or nothing can be improved because there is always a scope for improvement</text></g></svg>